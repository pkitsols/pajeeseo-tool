<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pajeeseo Diagnostic Tool</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #F9FAFB; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #111827; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #D1D5DB; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2563EB; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #1D4ED8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>SEO Diagnostic Tool</h2>
        <input type="text" id="urlInput" placeholder="Enter Website URL (e.g., https://google.com)">
        <button onclick="runDiagnostic()">Run Diagnostic</button>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        async function runDiagnostic() {
            const url = document.getElementById('urlInput').value;
            const resDiv = document.getElementById('result');
            resDiv.innerText = "Loading...";
            
            try {
                // Backend proxy ko call kar rahe hain
                const response = await fetch(`/api/proxy?type=pagespeed&url=${encodeURIComponent(url)}`);
                const data = await response.json();
                resDiv.innerText = "Audit complete! (Check Console for details)";
                console.log(data);
            } catch (err) {
                resDiv.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
